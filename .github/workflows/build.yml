name: Build and test
on: [push, pull_request]

permissions:
  contents: read

jobs:
  cmake:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest]
        lz4: ["OFF", "ON"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DENET_SERVER_WITH_LZ4=${{ matrix.lz4 }}
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENET_SERVER_WITH_LZ4=${{ matrix.lz4 }}
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  visual-studio:
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release, Debug-LZ4, Release-LZ4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build native Visual Studio 2022 solution
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (!$msbuild) { throw 'Visual Studio 2022 C++ build tools not found' }
          & $msbuild enet-server.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test native build
        shell: pwsh
        run: ./tests/Run-Tests.ps1 -Configuration '${{ matrix.configuration }}'
